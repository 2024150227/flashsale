<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashSale - 秒杀系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        /* User Info Bar */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            cursor: pointer;
            z-index: 100;
            position: relative;
            transition: transform 0.3s ease;
        }

        .user-details {
            color: white;
        }

        .user-details .username {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .user-details .user-id {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .logout-btn {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #e74c3c;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        /* Status Bar */
        .status-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-bar.success {
            background: rgba(39, 174, 96, 0.2);
        }

        .status-bar.error {
            background: rgba(231, 76, 60, 0.2);
        }

        /* Countdown Timer */
        .countdown {
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.2) 0%, rgba(245, 87, 108, 0.2) 100%);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(240, 147, 251, 0.3);
        }

        .countdown-title {
            color: white;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .timer-block {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 12px;
            min-width: 80px;
        }

        .timer-block span {
            display: block;
            color: #f093fb;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .timer-block label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Product Card */
        .product-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(240, 147, 251, 0.2);
            border-color: rgba(240, 147, 251, 0.4);
        }

        /* Product Image */
        .product-image {
            height: 220px;
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.3) 0%, rgba(245, 87, 108, 0.3) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            position: relative;
            overflow: hidden;
        }

        .product-image::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        /* Product Info */
        .product-info {
            padding: 25px;
        }

        .product-id {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .product-description {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            margin-bottom: 15px;
            height: 40px;
            overflow: hidden;
        }

        .product-price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 15px;
        }

        .product-price {
            color: #f5576c;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .product-original-price {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: line-through;
            font-size: 1rem;
        }

        .product-stock {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .product-stock .stock-icon {
            font-size: 1.2rem;
        }

        .product-stock .stock-value {
            color: #27ae60;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .product-stock.low .stock-value {
            color: #f39c12;
        }

        .product-stock.empty .stock-value {
            color: #e74c3c;
        }

        /* Favorite Button */
        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-favorite {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-favorite:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-favorite.active {
            background: rgba(240, 147, 251, 0.2);
            border-color: rgba(240, 147, 251, 0.5);
            color: #f093fb;
        }

        .btn-favorite.active .heart-icon {
            color: #f093fb;
        }

        .btn-primary {
            flex: 1;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-primary:disabled {
            background: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            transform: none;
        }

        /* Order Form */
        .order-form {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .order-form h2 {
            color: white;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus {
            outline: none;
            border-color: #f093fb;
            box-shadow: 0 0 20px rgba(240, 147, 251, 0.3);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 0.95rem;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #f093fb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* User Bar Buttons */
        .user-buttons {
            display: flex;
            gap: 10px;
        }

        .orders-btn {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid rgba(46, 204, 113, 0.4);
            color: #2ecc71;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .orders-btn:hover {
            background: rgba(46, 204, 113, 0.3);
            transform: scale(1.03);
        }

        .orders-btn:active {
            transform: scale(0.98);
        }

        /* Order Section */
        .orders-section {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .orders-section.active {
            display: block;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .orders-header h2 {
            color: white;
            font-size: 1.5rem;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .orders-empty {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .orders-grid {
            display: grid;
            gap: 15px;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .order-id {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        .order-product {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .order-info {
            display: flex;
            gap: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .order-right {
            text-align: right;
        }

        .order-price {
            color: #f5576c;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .order-status {
            color: #2ecc71;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .order-time {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .order-countdown {
            color: #f39c12;
            font-size: 0.85rem;
            margin-top: 8px;
            padding: 5px 10px;
            background: rgba(243, 156, 18, 0.1);
            border-radius: 8px;
            display: inline-block;
        }

        .cancel-btn {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #e74c3c;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 8px;
            transition: all 0.3s;
        }

        .cancel-btn:hover {
            background: rgba(231, 76, 60, 0.4);
        }

        /* Product Icons */
        .product-icon-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .product-icon-2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .product-icon-3 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .product-icon-4 {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .product-icon-5 {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .product-icon-6 {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }

        .product-icon-7 {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }

        .product-icon-8 {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h3 {
            color: white;
            margin: 0;
            font-size: 1.3rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-body {
            padding: 20px 25px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding: 20px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Avatar Section */
        .avatar-section {
            margin-bottom: 25px;
        }

        .avatar-section h4 {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
        }

        .emoji-option {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .emoji-option:hover {
            border-color: rgba(240, 147, 251, 0.5);
            transform: scale(1.1);
        }

        .emoji-option.selected {
            border-color: #f093fb;
            box-shadow: 0 0 15px rgba(240, 147, 251, 0.4);
            background: rgba(240, 147, 251, 0.2);
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #f093fb;
            background: rgba(240, 147, 251, 0.1);
        }

        .upload-area label {
            cursor: pointer;
            display: block;
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .upload-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        /* Upload Preview */
        .upload-preview {
            margin-top: 15px;
            text-align: center;
        }

        #previewImage {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        /* User Avatar */
        .user-avatar {
            cursor: pointer;
            transition: transform 0.3s;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        /* Footer */
        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 30px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>⚡ FlashSale 秒杀系统</h1>
            <p>精选好物，限时抢购，错过再等一年！</p>
        </header>

        <div class="user-bar" id="userBar" style="display: none;">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar" onclick="openAvatarModal()">👤</div>
                <div class="user-details">
                    <div class="username" id="username">用户名</div>
                    <div class="user-id">ID: <span id="userIdDisplay">0</span></div>
                </div>
            </div>
            <div class="user-buttons">
                <button class="orders-btn" id="ordersBtn" onclick="toggleOrders()">📋 我的订单</button>
                <button class="orders-btn" id="chatBtn" onclick="window.location.href='chat.html'">💬 智能客服</button>
                <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">退出登录</button>
            </div>
        </div>

        <!-- 头像更改弹窗 -->
        <div class="modal-overlay" id="avatarModal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>🎭 更改头像</h3>
                    <button class="modal-close" onclick="closeAvatarModal()">×</button>
                </div>
                <div class="modal-body">
                    <!-- Emoji头像选择 -->
                    <div class="avatar-section">
                        <h4>选择表情头像</h4>
                        <div class="emoji-grid" id="emojiGrid">
                            <!-- Emoji选项将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <!-- 图片上传 -->
                    <div class="avatar-section">
                        <h4>上传图片头像</h4>
                        <div class="upload-area" id="uploadArea">
                            <label for="avatarUpload">
                                <div class="upload-icon">📷</div>
                                <div class="upload-text">点击或拖拽上传图片</div>
                                <div class="upload-hint">支持 jpg、png、gif、webp 格式，最大 5MB</div>
                            </label>
                            <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
                        </div>
                        <div class="upload-preview" id="uploadPreview" style="display: none;">
                            <img id="previewImage" src="" alt="预览">
                            <button class="btn btn-secondary" onclick="clearPreview()">清除预览</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeAvatarModal()">取消</button>
                    <button class="btn btn-primary" id="saveAvatarBtn" onclick="saveAvatar()">保存头像</button>
                </div>
            </div>
        </div>

        <div class="orders-section" id="ordersSection">
            <div class="orders-header">
                <h2>📋 我的订单</h2>
                <button class="close-btn" onclick="toggleOrders()">×</button>
            </div>
            <div class="orders-grid" id="ordersGrid">
                <div class="loading">加载订单中</div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <span id="statusText">正在连接服务器...</span>
        </div>

        <div class="countdown">
            <div class="countdown-title">🔥 距离本场秒杀结束还有</div>
            <div class="countdown-timer">
                <div class="timer-block"><span id="hours">00</span><label>时</label></div>
                <div class="timer-block"><span id="minutes">00</span><label>分</label></div>
                <div class="timer-block"><span id="seconds">00</span><label>秒</label></div>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <div class="loading">加载商品中</div>
        </div>

        <div class="order-form">
            <h2>🎯 快速秒杀</h2>
            <form id="orderForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="userId">👤 用户ID</label>
                        <input type="number" id="userId" placeholder="请输入您的用户ID" required>
                    </div>
                    <div class="form-group">
                        <label for="productId">📦 商品ID</label>
                        <input type="number" id="productId" placeholder="输入要秒杀的商品ID" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">立即秒杀 ⚡</button>
            </form>
        </div>

        <footer>
            <p>© 2026 FlashSale 秒杀系统 | 专注高并发秒杀服务</p>
        </footer>
    </div>

    <script>
        const API_BASE = '/api/v1';
        const MAX_PRODUCTS = 20;

        // 商品图标库
        const productIcons = ['📱', '💻', '🎧', '🎮', '⌚', '🎵', '📷', '🎁', '💡', '🎨', '🚀', '🌟', '💎', '🎯', '⚽', '🏀', '🎸', '📚', '🍎', '🎪'];
        const gradientClasses = ['product-icon-1', 'product-icon-2', 'product-icon-3', 'product-icon-4', 'product-icon-5', 'product-icon-6', 'product-icon-7', 'product-icon-8'];

        // 倒计时功能
        function startCountdown() {
            const endTime = new Date();
            endTime.setHours(endTime.getHours() + 2); // 2小时后结束

            setInterval(() => {
                const now = new Date();
                const diff = endTime - now;

                if (diff <= 0) {
                    document.getElementById('hours').textContent = '00';
                    document.getElementById('minutes').textContent = '00';
                    document.getElementById('seconds').textContent = '00';
                    return;
                }

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            }, 1000);
        }

        let productsCache = null;

        async function checkServerStatus() {
            const statusBar = document.getElementById('statusBar');
            const statusText = document.getElementById('statusText');

            try {
                const response = await fetch('/health');
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'healthy') {
                        statusBar.className = 'status-bar success';
                        statusText.innerHTML = '✅ 服务器连接正常 | <span style="opacity:0.7">API 服务运行中</span>';
                    } else {
                        statusBar.className = 'status-bar error';
                        statusText.textContent = '❌ 服务器状态异常';
                    }
                } else {
                    statusBar.className = 'status-bar error';
                    statusText.textContent = '❌ 服务器响应异常';
                }
            } catch (error) {
                statusBar.className = 'status-bar error';
                statusText.textContent = '❌ 无法连接服务器';
            }
        }

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '<div class="loading">加载商品中</div>';

            try {
                let products;
                if (productsCache) {
                    products = productsCache;
                } else {
                    const response = await fetch(`${API_BASE}/products/`);
                    if (!response.ok) throw new Error('HTTP error');
                    products = await response.json();
                    productsCache = products;
                }

                const token = localStorage.getItem('access_token');
                let favoriteIds = [];
                if (token) {
                    try {
                        const favResponse = await fetch(`${API_BASE}/auth/favorite`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (favResponse.ok) {
                            const favData = await favResponse.json();
                            favoriteIds = favData.favorites || [];
                        }
                    } catch (e) {
                        console.log('Failed to load favorites');
                    }
                }

                products = products.map(p => ({
                    ...p,
                    is_favorite: favoriteIds.includes(p.id)
                }));

                const displayProducts = products.slice(0, MAX_PRODUCTS);

                if (displayProducts.length === 0) {
                    grid.innerHTML = '<div class="loading">暂无秒杀商品</div>';
                    return;
                }

                grid.innerHTML = displayProducts.map((product, index) => {
                    const icon = productIcons[index % productIcons.length];
                    const gradientClass = gradientClasses[index % gradientClasses.length];
                    const stockClass = product.stock <= 0 ? 'empty' : product.stock <= 10 ? 'low' : '';
                    const originalPrice = (product.price * 1.5).toFixed(2);

                    return `
                        <div class="product-card" data-product-id="${product.id}">
                            <div class="product-image ${gradientClass}">
                                ${icon}
                            </div>
                            <div class="product-info">
                                <div class="product-id">商品 ID: ${product.id}</div>
                                <div class="product-name">${product.name}</div>
                                <div class="product-description">${product.description || '限时特惠，数量有限'}</div>
                                <div class="product-price-row">
                                    <div class="product-price">¥${product.price.toFixed(2)}</div>
                                    <div class="product-original-price">¥${originalPrice}</div>
                                </div>
                                <div class="product-stock ${stockClass}">
                                    <span class="stock-icon">📦</span>
                                    <span>剩余库存:</span>
                                    <span class="stock-value">${product.stock}</span>
                                </div>
                                <div class="product-actions">
                                    <button class="btn-favorite ${product.is_favorite ? 'active' : ''}" 
                                            onclick="toggleFavorite(${product.id}, this)">
                                        <span class="heart-icon">${product.is_favorite ? '❤️' : '🤍'}</span>
                                        <span>${product.is_favorite ? '已收藏' : '收藏'}</span>
                                    </button>
                                    <button class="btn btn-primary" ${product.stock <= 0 ? 'disabled' : ''} 
                                            onclick="quickOrder(${product.id})">
                                        ${product.stock <= 0 ? '已抢光' : '立即抢购'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                grid.innerHTML = '<div class="loading">加载失败，请检查服务</div>';
                console.error('Load products error:', error);
            }
        }

        async function createOrder(userId, productId) {
            try {
                const token = localStorage.getItem('access_token');
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                const response = await fetch(`${API_BASE}/orders/`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ user_id: userId, product_id: productId })
                });

                const data = await response.json();
                if (response.ok) {
                    showToast('✅ 下单成功', 'success');
                    // 清除缓存，强制从服务器获取最新库存
                    productsCache = null;
                    loadProducts();
                    // 强制刷新订单列表（即使订单列表已打开）
                    const ordersSection = document.getElementById('ordersSection');
                    if (ordersSection.classList.contains('active')) {
                        loadOrders();
                    }
                    // 3秒后再次刷新订单列表（确保异步订单已处理）
                    setTimeout(() => {
                        const ordersSection = document.getElementById('ordersSection');
                        if (ordersSection.classList.contains('active')) {
                            loadOrders();
                        }
                    }, 3000);
                } else {
                    // 根据不同的错误类型显示不同的提示
                    let errorMsg = data.detail || '操作失败';
                    if (response.status === 401) {
                        errorMsg = '请先登录或重新登录';
                    } else if (response.status === 429) {
                        errorMsg = '请求过于频繁，请稍后再试';
                    }
                    showToast(errorMsg, 'error');
                }
            } catch (error) {
                console.error('Create order error:', error);
                showToast('网络异常，请稍后重试', 'error');
            }
        }

        // 订单列表切换
        function toggleOrders() {
            const ordersSection = document.getElementById('ordersSection');
            if (ordersSection.classList.contains('active')) {
                ordersSection.classList.remove('active');
            } else {
                ordersSection.classList.add('active');
                loadOrders();
            }
        }

        // 加载订单列表
        async function loadOrders() {
            const grid = document.getElementById('ordersGrid');
            grid.innerHTML = '<div class="loading">加载订单中</div>';

            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    grid.innerHTML = '<div class="orders-empty">请先登录</div>';
                    return;
                }

                const response = await fetch(`${API_BASE}/orders/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        grid.innerHTML = '<div class="orders-empty">登录已过期，请重新登录</div>';
                        return;
                    }
                    throw new Error('HTTP error');
                }

                const data = await response.json();

                if (!data.orders || data.orders.length === 0) {
                    grid.innerHTML = '<div class="orders-empty">📭 暂无订单</div>';
                    return;
                }

                grid.innerHTML = data.orders.map(order => {
                    const productName = `商品 #${order.product_id}`;
                    const date = new Date(order.created_at);
                    const formattedDate = date.toLocaleString('zh-CN');

                    const createdTime = new Date(order.created_at).getTime();
                    const now = Date.now();
                    const elapsed = now - createdTime;
                    const remaining = 24 * 60 * 60 * 1000 - elapsed;
                    const canCancel = remaining > 0 && order.status === 'completed';

                    let countdownHtml = '';
                    if (canCancel) {
                        const hours = Math.floor(remaining / (1000 * 60 * 60));
                        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
                        countdownHtml = `<div class="order-countdown" data-remaining="${remaining}" data-order-id="${order.id}">
                            <span class="countdown-text">剩余 ${hours}时${minutes}分${seconds}秒 可取消</span>
                        </div>`;
                    }

                    let statusHtml = '';
                    if (order.status === 'completed') {
                        statusHtml = canCancel ? '✅ 待发货' : '✅ 已完成';
                    } else if (order.status === 'cancelled') {
                        statusHtml = '❌ 已取消';
                    } else if (order.status === 'refunded') {
                        statusHtml = '💰 已退款';
                    } else {
                        statusHtml = order.status;
                    }

                    return `
                        <div class="order-card" data-order-id="${order.id}">
                            <div class="order-left">
                                <div class="order-id">订单 #${order.id}</div>
                                <div class="order-product">${productName}</div>
                                <div class="order-info">
                                    <span>用户 ID: ${order.user_id}</span>
                                </div>
                                ${countdownHtml}
                            </div>
                            <div class="order-right">
                                <div class="order-price">¥${order.price.toFixed(2)}</div>
                                <div class="order-status">${statusHtml}</div>
                                <div class="order-time">${formattedDate}</div>
                                ${canCancel ? `<button class="cancel-btn" onclick="cancelOrder(${order.id})">取消订单</button>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                if (typeof startOrderCountdown === 'function') {
                    startOrderCountdown();
                }
            } catch (error) {
                grid.innerHTML = '<div class="orders-empty">加载失败，请重试</div>';
                console.error('Load orders error:', error);
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm('确定要取消该订单吗？库存将退还。')) {
                return;
            }

            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    showToast('请先登录', 'error');
                    return;
                }

                const response = await fetch(`${API_BASE}/orders/${orderId}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                let data;
                try {
                    data = await response.json();
                } catch (jsonError) {
                    const textResponse = await response.text();
                    console.error('JSON解析失败，响应内容:', textResponse);
                    if (response.status === 401) {
                        showToast('登录已过期，请重新登录', 'error');
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        localStorage.removeItem('user_info');
                        setTimeout(() => window.location.href = '/login', 1500);
                        return;
                    }
                    showToast('服务器返回无效响应', 'error');
                    return;
                }

                if (response.ok) {
                    showToast('订单已取消', 'success');
                    loadOrders();
                } else {
                    if (response.status === 401) {
                        showToast('登录已过期，请重新登录', 'error');
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        localStorage.removeItem('user_info');
                        setTimeout(() => window.location.href = '/login', 1500);
                    } else {
                        showToast('取消失败: ' + (data.detail || '未知错误'), 'error');
                    }
                }
            } catch (error) {
                console.error('取消订单异常:', error);
                showToast('取消失败，请重试', 'error');
            }
        }

        function startOrderCountdown() {
            const countdowns = document.querySelectorAll('.order-countdown');
            countdowns.forEach(el => {
                let remaining = parseInt(el.dataset.remaining);
                const orderId = el.dataset.orderId;

                const updateCountdown = () => {
                    remaining -= 1000;
                    const orderEl = document.querySelector(`.order-card[data-order-id="${orderId}"]`);
                    if (!orderEl) return;

                    const countdownEl = orderEl.querySelector('.order-countdown');
                    if (!countdownEl) return;

                    if (remaining <= 0) {
                        countdownEl.querySelector('.countdown-text').textContent = '已过可取消时间';
                        countdownEl.style.background = 'rgba(150, 150, 150, 0.1)';
                        const cancelBtn = orderEl.querySelector('.cancel-btn');
                        if (cancelBtn) cancelBtn.remove();
                        const statusEl = orderEl.querySelector('.order-status');
                        if (statusEl) statusEl.textContent = '✅ 已完成';
                        return;
                    }

                    const h = Math.floor(remaining / (1000 * 60 * 60));
                    const m = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((remaining % (1000 * 60)) / 1000);
                    countdownEl.querySelector('.countdown-text').textContent = `剩余 ${h}时${m}分${s}秒 可取消`;
                };

                updateCountdown();
                setInterval(updateCountdown, 1000);
            });
        }

        async function toggleFavorite(productId, btnElement) {
            const token = localStorage.getItem('access_token');
            if (!token) {
                showToast('请先登录后再收藏商品', 'error');
                return;
            }

            const isFavorite = btnElement.classList.contains('active');

            try {
                if (isFavorite) {
                    const response = await fetch(`${API_BASE}/auth/favorite/${productId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        btnElement.classList.remove('active');
                        btnElement.querySelector('.heart-icon').textContent = '🤍';
                        btnElement.querySelector('span:last-child').textContent = '收藏';
                        showToast('已取消收藏', 'success');
                    }
                } else {
                    const response = await fetch(`${API_BASE}/auth/favorite/${productId}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        btnElement.classList.add('active');
                        btnElement.querySelector('.heart-icon').textContent = '❤️';
                        btnElement.querySelector('span:last-child').textContent = '已收藏';
                        showToast('收藏成功 ❤️', 'success');
                    }
                }
            } catch (error) {
                showToast('操作失败，请重试', 'error');
            }
        }

        function quickOrder(productId) {
            const userInfo = localStorage.getItem('user_info');
            let userId;

            if (userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    userId = user.id;
                } catch (e) {
                    showToast('请先登录', 'error');
                    return;
                }
            }

            if (!userId) {
                showToast('请先登录', 'error');
                return;
            }

            createOrder(userId, productId);
        }

        document.getElementById('orderForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const userId = document.getElementById('userId').value;
            const productId = document.getElementById('productId').value;
            createOrder(parseInt(userId), parseInt(productId));
        });

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function loadUserInfo() {
            const userInfo = localStorage.getItem('user_info');
            if (userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    document.getElementById('username').textContent = user.name || user.username;
                    document.getElementById('userIdDisplay').textContent = user.id;
                    document.getElementById('userBar').style.display = 'flex';

                    // 更新头像显示
                    if (user.avatar) {
                        updateAvatarDisplay(user.avatar);
                    }
                } catch (e) {
                    console.error('加载用户信息失败:', e);
                }
            }
        }

        async function handleLogout() {
            if (!confirm('确定要退出登录吗？')) {
                return;
            }

            try {
                const token = localStorage.getItem('access_token');
                if (token) {
                    const response = await fetch(`${API_BASE}/auth/logout`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (!response.ok) {
                        console.warn('登出请求返回非200状态:', response.status);
                    }
                }
            } catch (error) {
                console.warn('登出请求失败，继续清除本地存储:', error);
            } finally {
                // 清除所有本地存储数据
                localStorage.clear();
                sessionStorage.clear();

                // 清除页面缓存
                productsCache = null;

                // 使用更强的方法强制刷新到登录页面
                const loginUrl = '/login?' + Date.now() + '&rand=' + Math.random().toString(36).substr(2, 9);

                // 强制浏览器重新加载，不使用缓存
                window.location.href = loginUrl;
                setTimeout(function () {
                    window.location.reload(true);
                }, 100);
            }
        }

        // 可选头像列表
        const AVATARS = [
            '👤', '👩', '👨', '👧', '👦', '👵',
            '👴', '🧑', '👱', '👸', '🤴', '🧔',
            '👲', '🧕', '👳', '🦸', '🦹', '🧙',
            '🐶', '🐱', '🐼', '🐨', '🦊', '🐰'
        ];

        let selectedEmoji = null;
        let selectedFile = null;

        // 打开头像更改弹窗
        function openAvatarModal() {
            selectedEmoji = null;
            selectedFile = null;
            renderEmojiGrid();
            clearPreview();
            document.getElementById('avatarModal').style.display = 'flex';
        }

        // 关闭头像更改弹窗
        function closeAvatarModal() {
            document.getElementById('avatarModal').style.display = 'none';
            selectedEmoji = null;
            selectedFile = null;
        }

        // 渲染Emoji头像网格
        function renderEmojiGrid() {
            const emojiGrid = document.getElementById('emojiGrid');
            const userInfo = JSON.parse(localStorage.getItem('user_info') || '{}');
            const currentAvatar = userInfo.avatar || '👤';

            emojiGrid.innerHTML = AVATARS.map((avatar) => {
                const isSelected = avatar === currentAvatar && !selectedFile;
                return `
                    <div class="emoji-option ${isSelected ? 'selected' : ''}" data-emoji="${avatar}" onclick="selectEmoji('${avatar}')">
                        ${avatar}
                    </div>
                `;
            }).join('');

            selectedEmoji = isEmoji(currentAvatar) ? currentAvatar : null;
        }

        // 判断是否为emoji
        function isEmoji(str) {
            return str && !str.startsWith('/') && !str.startsWith('http');
        }

        // 选择Emoji
        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            selectedFile = null;
            clearPreview();

            document.querySelectorAll('.emoji-option').forEach(opt => opt.classList.remove('selected'));
            document.querySelector(`[data-emoji="${emoji}"]`).classList.add('selected');
        }

        // 处理文件选择
        document.getElementById('avatarUpload').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                selectedEmoji = null;

                document.querySelectorAll('.emoji-option').forEach(opt => opt.classList.remove('selected'));

                // 预览图片
                const reader = new FileReader();
                reader.onload = function (event) {
                    document.getElementById('previewImage').src = event.target.result;
                    document.getElementById('uploadPreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // 清除预览
        function clearPreview() {
            document.getElementById('uploadPreview').style.display = 'none';
            document.getElementById('previewImage').src = '';
            selectedFile = null;
        }

        // 保存头像
        async function saveAvatar() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                showToast('请先登录', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveAvatarBtn');
            const originalText = saveBtn.textContent;
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';

            try {
                if (selectedFile) {
                    // 上传图片头像
                    const formData = new FormData();
                    formData.append('file', selectedFile);

                    const response = await fetch(`${API_BASE}/auth/avatar`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.detail || '上传失败');
                    }

                    const data = await response.json();
                    localStorage.setItem('user_info', JSON.stringify(data));
                    updateAvatarDisplay(data.avatar);
                    showToast('✅ 头像上传成功', 'success');
                } else if (selectedEmoji) {
                    // 使用Emoji头像
                    const response = await fetch(`${API_BASE}/auth/avatar/emoji?emoji=${encodeURIComponent(selectedEmoji)}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.detail || '设置失败');
                    }

                    const data = await response.json();
                    localStorage.setItem('user_info', JSON.stringify(data));
                    updateAvatarDisplay(data.avatar);
                    showToast('✅ 头像设置成功', 'success');
                } else {
                    showToast('请选择头像或上传图片', 'error');
                    return;
                }

                closeAvatarModal();
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = originalText;
            }
        }

        // 更新头像显示
        function updateAvatarDisplay(avatar) {
            const avatarElement = document.getElementById('userAvatar');
            if (avatar && isEmoji(avatar)) {
                avatarElement.textContent = avatar;
            } else if (avatar && avatar.startsWith('/avatars/')) {
                avatarElement.innerHTML = `<img src="${avatar}" alt="头像" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            startCountdown();
            checkServerStatus();
            loadProducts();
            loadUserInfo();

            // 定期刷新状态
            setInterval(checkServerStatus, 30000);
        });
    </script>
</body>

</html>
