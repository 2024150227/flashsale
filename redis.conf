# Redis 持久化配置文件
# 同时启用 RDB 和 AOF，保证数据安全性

# RDB 快照配置
# 900秒内至少1个key变化则快照
save 900 1
# 300秒内至少10个key变化则快照
save 300 10
# 60秒内至少10000个key变化则快照
save 60 10000

# RDB 文件压缩
rdbcompression yes
rdbchecksum yes

# AOF 持久化配置
appendonly yes
appendfilename "appendonly.aof"

# AOF 刷新策略
# always: 每个写命令都刷盘（最安全，性能最差）
# everysec: 每秒刷盘一次（默认，平衡安全和性能）
# no: 交给操作系统决定（性能最好，最不安全）
appendfsync everysec

# AOF 重写配置
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 混合持久化（Redis 4.0+）
aof-use-rdb-preamble yes